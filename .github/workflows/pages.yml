name: Deploy Daylist to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Version offline cache
        run: sed -i "s/const cacheName = prefix + '[^']*';/const cacheName = prefix + '${GITHUB_SHA}';/" public/sw.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          name: ${{ env.PAGES_ARTIFACT }}
          retention-days: 7
      - name: Record artifact name
        id: artifact
        run: echo "name=$PAGES_ARTIFACT" >> "$GITHUB_OUTPUT"

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: ${{ needs.package.outputs.artifact_name }}
